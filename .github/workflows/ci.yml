name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install ruff==0.15.11
      - run: ruff check --output-format=github .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Unit, API and contract tests (coverage >= 85%)
        run: pytest -q --cov --cov-report=term --cov-report=xml --junitxml=junit.xml
      - name: Coverage summary
        if: always() && matrix.python-version == '3.12'
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          r = ET.parse("coverage.xml").getroot()
          print(f"### Coverage: {float(r.get('line-rate')) * 100:.1f}% lines, "
                f"{float(r.get('branch-rate')) * 100:.1f}% branches")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-py${{ matrix.python-version }}
          path: |
            junit.xml
            coverage.xml

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: Audit pinned dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt --strict --progress-spinner off

  e2e:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Build image and start stack (image + mock Risk Assessment / NVD)
        run: docker compose -f docker-compose.e2e.yml up -d --build --wait
      - name: End-to-end tests against the container
        run: E2E_BASE_URL=http://localhost:5000 pytest -q -m e2e tests/e2e
      - name: Container logs
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v
